<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>תקין · תקן לי: תיבת הסכמה לדיוור</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F8F8}
*{box-sizing:border-box}
a{color:#0E5A63}a:hover{color:#0A464D}
:focus-visible{outline:3px solid #E0A100;outline-offset:3px;border-radius:8px}
.btn-primary{background:#0E5A63;color:#FFFFFF;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.btn-primary:hover{background:#0A464D;color:#FFFFFF}
.btn-ghost{background:#FFFFFF;color:#0E5A63;text-decoration:none;border:1.5px solid #0E5A63;cursor:pointer;font-family:inherit}
.btn-ghost:hover{background:#E6F2F1;color:#0A464D}
.icon-btn{background:#FFFFFF;border:1px solid #D5E0E1;color:#10242E;cursor:pointer;text-decoration:none}
.icon-btn:hover{background:#F5F8F8;color:#10242E}
</style>
</helmet>
<div dir="rtl" style="font-family: 'Heebo', system-ui, sans-serif; color: #10242E; font-size: 17px; line-height: 1.6; min-height: 100vh; position: relative; background: #F5F8F8">

<div aria-hidden="true" style="max-width: 960px; margin: 0 auto; padding: 100px 20px; display: flex; flex-direction: column; gap: 14px; filter: blur(3px)">
<div style="height: 120px; background: #FFFFFF; border-radius: 24px"></div>
<div style="height: 80px; background: #FFFFFF; border-radius: 20px"></div>
<div style="height: 80px; background: #FFFFFF; border-radius: 20px"></div>
<div style="height: 80px; background: #FFFFFF; border-radius: 20px"></div>
</div>

<div style="position: absolute; inset: 0; background: rgba(11,34,48,0.55); display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px">
<section role="dialog" aria-modal="true" aria-labelledby="fix-title" style="width: 100%; max-width: 760px; background: #FFFFFF; border-radius: 28px; box-shadow: 0 30px 80px rgba(11,34,48,0.3); display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 24px 28px 18px; display: flex; align-items: flex-start; gap: 16px; border-bottom: 1px solid #E3EAEB">
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #0E5A63"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4 2.6-2.6z"></path></svg>תקן לי · ספאם ודיוור</span>
<h1 id="fix-title" style="margin: 0; font-size: 24px; font-weight: 800; color: #0B2230; line-height: 1.3">מוסיפים לטופס תיבת הסכמה לדיוור</h1>
</div>
<a class="icon-btn" href="Report-Full.dc.html" aria-label="סגירה" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></a>
</div>

<div style="padding: 24px 28px; display: flex; flex-direction: column; gap: 22px">

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px">
<figure style="margin: 0; border: 1px solid #E3EAEB; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #FAFBFB">
<figcaption style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: #B42318"><span style="width: 9px; height: 9px; border-radius: 50%; background: #B42318"></span>לפני</figcaption>
<div style="background: #FFFFFF; border: 1px solid #E3EAEB; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 15px">
<span style="color: #475B64; font-size: 14px">שם מלא</span><span style="height: 34px; border: 1px solid #D5E0E1; border-radius: 8px"></span>
<span style="color: #475B64; font-size: 14px">טלפון</span><span style="height: 34px; border: 1px solid #D5E0E1; border-radius: 8px"></span>
<span style="align-self: flex-start; margin-top: 4px; background: #10242E; color: #FFFFFF; font-size: 14px; padding: 6px 14px; border-radius: 8px">שליחה</span>
</div>
</figure>
<figure style="margin: 0; border: 1.5px solid #0E5A63; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #F3F9F8">
<figcaption style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: #0E5A63"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>אחרי</figcaption>
<div style="background: #FFFFFF; border: 1px solid #E3EAEB; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 15px">
<span style="color: #475B64; font-size: 14px">שם מלא</span><span style="height: 34px; border: 1px solid #D5E0E1; border-radius: 8px"></span>
<span style="color: #475B64; font-size: 14px">טלפון</span><span style="height: 34px; border: 1px solid #D5E0E1; border-radius: 8px"></span>
<span style="display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: #10242E; background: #E6F2F1; border-radius: 8px; padding: 8px"><span style="width: 18px; height: 18px; flex: none; border: 2px solid #0E5A63; border-radius: 4px; margin-top: 2px; background: #FFFFFF"></span>אני מאשר/ת לקבל מ[שם העסק] עדכונים ומבצעים במסרונים, בוואטסאפ ובמייל. אפשר להסיר את ההרשמה בכל עת.</span>
<span style="align-self: flex-start; margin-top: 4px; background: #10242E; color: #FFFFFF; font-size: 14px; padding: 6px 14px; border-radius: 8px">שליחה</span>
</div>
</figure>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700; color: #0B2230">קוד מוכן להדבקה בטופס</h2>
<button class="btn-primary" type="button" onClick="{{copy}}" style="min-height: 44px; padding: 0 18px; border-radius: 12px; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px">
<sc-if value="{{notCopied}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h8"></path></svg></sc-if>
<sc-if value="{{copied}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
{{copyLabel}}</button>
</div>
<pre dir="ltr" style="margin: 0; background: #0B2230; color: #E6EEF0; border-radius: 16px; padding: 18px 20px; font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 15px; line-height: 1.7; white-space: pre-wrap; overflow-x: auto; text-align: left"><code>{{snippet}}</code></pre>
<p aria-live="polite" style="margin: 0; font-size: 15px; color: #0E5A63; font-weight: 600; min-height: 24px">{{liveMsg}}</p>
</div>

<div style="display: flex; gap: 10px; align-items: flex-start; background: #FFF8EC; border-radius: 14px; padding: 14px 16px; font-size: 16px; color: #10242E">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A34A06" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 3px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16.5v.01"></path></svg>
<p style="margin: 0">שימו לב: התיבה לא מסומנת מראש. הגולש צריך לסמן אותה בעצמו, ושליחת דיוור רק למי שסימן.</p>
</div>
</div>

<div style="padding: 18px 28px 24px; border-top: 1px solid #E3EAEB; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center">
<a href="#send-to-builder" style="font-weight: 600; font-size: 16px; min-height: 44px; display: inline-flex; align-items: center">שליחה לבונה האתר במייל</a>
<div style="display: flex; gap: 10px">
<a class="btn-ghost" href="Report-Full.dc.html" style="min-height: 48px; padding: 0 20px; border-radius: 12px; font-weight: 600; display: inline-flex; align-items: center">אחר כך</a>
<a class="btn-primary" href="Report-Full.dc.html" style="min-height: 48px; padding: 0 20px; border-radius: 12px; font-weight: 700; display: inline-flex; align-items: center">סימנתי כמטופל</a>
</div>
</div>

</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { copied: false };
  }
  componentWillUnmount() { if (this.t) clearTimeout(this.t); }
  renderVals() {
    const snippet = '<label class="consent">\n  <input type="checkbox" name="marketing_consent" value="yes">\n  אני מאשר/ת לקבל מ[שם העסק] עדכונים ומבצעים\n  במסרונים, בוואטסאפ ובמייל. אפשר להסיר את ההרשמה בכל עת.\n</label>';
    const copied = !!this.state.copied;
    return {
      snippet: snippet,
      copied: copied,
      notCopied: !copied,
      copyLabel: copied ? 'הועתק' : 'העתק',
      liveMsg: copied ? 'הקוד הועתק. מדביקים אותו בטופס, מעל כפתור השליחה.' : '',
      copy: () => {
        try { if (navigator.clipboard) navigator.clipboard.writeText(snippet).catch(() => {}); } catch (e) {}
        this.setState({ copied: true });
        if (this.t) clearTimeout(this.t);
        this.t = setTimeout(() => this.setState({ copied: false }), 4000);
      }
    };
  }
}
</script>
</body>
</html>
